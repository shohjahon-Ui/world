<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World AI — Suhbat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220; --bg-soft:#0F1A2E; --surface:#131F35; --surface-2:#182647;
    --line:#24365A; --text:#EAF0FA; --text-dim:#93A3BE;
    --cyan:#33D6C0; --gold:#F2B84B; --coral:#FF7A59;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
  }
  .top{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; border-bottom:1px solid var(--line);
    background:rgba(11,18,32,0.9);
  }
  .brand{display:flex; align-items:center; gap:10px; font-family:'Space Grotesk'; font-weight:600; font-size:18px;}
  .brand svg{width:26px;height:26px;}
  .status{font-size:13px; color:var(--text-dim); display:flex; align-items:center; gap:6px;}
  .status .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);}

  .langbar{display:flex; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px;}
  .langbar button{
    font-family:inherit; font-size:13px; padding:7px 14px; border-radius:999px; border:none;
    background:transparent; color:var(--text-dim); cursor:pointer; transition:.15s;
  }
  .langbar button.active{background:var(--cyan); color:#0B1220; font-weight:700;}
  .langbar button:hover:not(.active){color:var(--text);}

  main{
    flex:1; display:flex; justify-content:center; padding:28px 20px 20px;
  }
  .chat-wrap{
    width:100%; max-width:760px; display:flex; flex-direction:column;
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    overflow:hidden; height:calc(100vh - 130px); min-height:420px;
  }
  .messages{
    flex:1; overflow-y:auto; padding:26px; display:flex; flex-direction:column; gap:16px;
  }
  .messages::-webkit-scrollbar{width:8px;}
  .messages::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}

  .row{display:flex; gap:12px; max-width:82%;}
  .row.user{align-self:flex-end; flex-direction:row-reverse;}
  .avatar{
    width:32px; height:32px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; font-family:'Space Grotesk';
  }
  .avatar.ai{background:rgba(51,214,192,0.15); color:var(--cyan); border:1px solid rgba(51,214,192,0.3);}
  .avatar.user{background:var(--surface-2); color:var(--gold); border:1px solid var(--line);}
  .bubble{
    padding:13px 16px; border-radius:14px; font-size:15px; line-height:1.55; white-space:pre-wrap;
  }
  .row.ai .bubble{background:var(--bg-soft); border:1px solid var(--line); border-bottom-left-radius:4px;}
  .row.user .bubble{background:var(--surface-2); border-bottom-right-radius:4px;}

  .typing{display:flex; gap:4px; padding:6px 2px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--text-dim); animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  .empty{
    margin:auto; text-align:center; color:var(--text-dim); max-width:340px;
  }
  .empty h3{font-family:'Space Grotesk'; color:var(--text); font-size:19px; margin-bottom:8px;}
  .empty p{font-size:14px;}
  .suggestions{display:flex; flex-direction:column; gap:8px; margin-top:18px;}
  .sugg{
    background:var(--bg-soft); border:1px solid var(--line); border-radius:10px; padding:10px 14px;
    font-size:13.5px; color:var(--text); cursor:pointer; text-align:left;
  }
  .sugg:hover{border-color:var(--cyan);}

  .input-bar{
    border-top:1px solid var(--line); padding:16px 20px; display:flex; gap:10px; align-items:flex-end;
    background:var(--surface);
  }
  textarea{
    flex:1; resize:none; background:var(--bg-soft); border:1px solid var(--line); border-radius:12px;
    color:var(--text); font-family:inherit; font-size:14.5px; padding:12px 14px; max-height:120px;
    outline:none;
  }
  textarea:focus{border-color:var(--cyan);}
  .send{
    background:var(--cyan); color:#0B1220; border:none; border-radius:12px; padding:0 20px; height:44px;
    font-weight:700; font-size:14px; cursor:pointer; flex-shrink:0;
  }
  .send:disabled{opacity:.5; cursor:not-allowed;}
  .hint{font-size:12px; color:var(--text-dim); text-align:center; padding:8px 0 4px;}
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14" stroke="#33D6C0" stroke-width="2"/><ellipse cx="16" cy="16" rx="14" ry="5.5" stroke="#F2B84B" stroke-width="1.4"/></svg>
    World AI
  </div>
  <div class="langbar" id="langbar">
    <button data-lang="uz" class="active">UZ</button>
    <button data-lang="en">EN</button>
    <button data-lang="zh">中文</button>
    <button data-lang="ko">한국어</button>
  </div>
  <div class="status"><div class="dot"></div><span id="statusText">Onlayn</span></div>
</div>

<main>
  <div class="chat-wrap">
    <div class="messages" id="messages">
      <div class="empty" id="emptyState">
        <h3 id="emptyTitle">Nimani o'rganmoqchisiz?</h3>
        <p id="emptySub">Python, Django yoki dasturlashga oid har qanday savolingizni bering.</p>
        <div class="suggestions" id="suggestions"></div>
      </div>
    </div>
    <div class="input-bar">
      <textarea id="input" rows="1" placeholder="Xabar yozing…"></textarea>
      <button class="send" id="sendBtn">Yuborish</button>
    </div>
  </div>
</main>
<div class="hint" id="hintText">World AI xatolarga yo'l qo'yishi mumkin — muhim narsalarni tekshirib ko'ring.</div>

<script>
const i18n = {
  uz: {
    title: "Nimani o'rganmoqchisiz?",
    sub: "Python, Django yoki dasturlashga oid har qanday savolingizni bering.",
    sugg: ["Python'da list nima?", "Django loyihasini qanday boshlayman?", "AI qanday ishlaydi?"],
    placeholder: "Xabar yozing…",
    send: "Yuborish",
    online: "Onlayn",
    thinking: "yozmoqda…",
    hint: "World AI xatolarga yo'l qo'yishi mumkin — muhim narsalarni tekshirib ko'ring.",
    systemLang: "Uzbek (lotin yozuvida)"
  },
  en: {
    title: "What do you want to learn?",
    sub: "Ask anything about Python, Django, or programming in general.",
    sugg: ["What is a list in Python?", "How do I start a Django project?", "How does AI work?"],
    placeholder: "Type a message…",
    send: "Send",
    online: "Online",
    thinking: "typing…",
    hint: "World AI can make mistakes — check important info.",
    systemLang: "English"
  },
  zh: {
    title: "你想学习什么？",
    sub: "可以问我任何关于 Python、Django 或编程的问题。",
    sugg: ["Python 中的列表是什么？", "如何开始一个 Django 项目？", "AI 是如何工作的？"],
    placeholder: "输入消息…",
    send: "发送",
    online: "在线",
    thinking: "正在输入…",
    hint: "World AI 可能会出错，请核实重要信息。",
    systemLang: "Simplified Chinese"
  },
  ko: {
    title: "무엇을 배우고 싶으신가요?",
    sub: "Python, Django 또는 프로그래밍에 관한 질문을 해보세요.",
    sugg: ["Python의 리스트란 무엇인가요?", "Django 프로젝트는 어떻게 시작하나요?", "AI는 어떻게 작동하나요?"],
    placeholder: "메시지를 입력하세요…",
    send: "보내기",
    online: "온라인",
    thinking: "입력 중…",
    hint: "World AI는 실수를 할 수 있습니다. 중요한 정보는 확인하세요.",
    systemLang: "Korean"
  }
};

let currentLang = "uz";
let history = [];

const messagesEl = document.getElementById('messages');
const emptyState = document.getElementById('emptyState');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

function applyLang(lang){
  currentLang = lang;
  const t = i18n[lang];
  document.querySelectorAll('#langbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  document.getElementById('emptyTitle').textContent = t.title;
  document.getElementById('emptySub').textContent = t.sub;
  document.getElementById('statusText').textContent = t.online;
  inputEl.placeholder = t.placeholder;
  sendBtn.textContent = t.send;
  document.getElementById('hintText').textContent = t.hint;
  const sg = document.getElementById('suggestions');
  sg.innerHTML = '';
  t.sugg.forEach(s=>{
    const b = document.createElement('button');
    b.className = 'sugg';
    b.textContent = s;
    b.onclick = ()=>{ inputEl.value = s; sendMessage(); };
    sg.appendChild(b);
  });
}

document.getElementById('langbar').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  applyLang(btn.dataset.lang);
});

function addRow(role, text){
  if(emptyState.parentElement) emptyState.remove();
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const av = document.createElement('div');
  av.className = 'avatar ' + role;
  av.textContent = role === 'ai' ? 'W' : 'S';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(av);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function addTyping(){
  const row = document.createElement('div');
  row.className = 'row ai';
  row.id = 'typingRow';
  const av = document.createElement('div');
  av.className = 'avatar ai';
  av.textContent = 'W';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  row.appendChild(av);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeTyping(){
  const r = document.getElementById('typingRow');
  if(r) r.remove();
}

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  addRow('user', text);
  history.push({role:'user', content: text});
  sendBtn.disabled = true;
  addTyping();

  const t = i18n[currentLang];
  const systemPrompt = `You are World AI, a friendly programming tutor for junior IT students on the "World" learning platform. Always answer in ${t.systemLang}. Keep answers clear, encouraging, and beginner-friendly, with short code examples when useful.`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: history
      })
    });
    const data = await response.json();
    removeTyping();
    const textBlock = (data.content || []).map(c => c.type === 'text' ? c.text : '').join('\n').trim();
    const reply = textBlock || "Kechirasiz, javob olishda muammo bo'ldi.";
    addRow('ai', reply);
    history.push({role:'assistant', content: reply});
  }catch(err){
    removeTyping();
    addRow('ai', "Xatolik yuz berdi. Birozdan so'ng qayta urinib ko'ring.");
    console.error(err);
  }finally{
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener('input', ()=>{
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

applyLang('uz');
</script>
</body>
</html>
