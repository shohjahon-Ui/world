<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World — Kirish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220; --bg-soft:#0F1A2E; --surface:#131F35; --surface-2:#182647;
    --line:#24365A; --text:#EAF0FA; --text-dim:#93A3BE;
    --cyan:#33D6C0; --gold:#F2B84B; --coral:#FF7A59; --violet:#8B93F5;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    position:relative; overflow:hidden; padding:20px;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; font-weight:600;}

  /* Animatsiyali fon */
  .bg-glow{
    position:absolute; border-radius:50%; filter:blur(90px); opacity:0.35; z-index:0;
    animation:float 12s ease-in-out infinite;
  }
  .bg-glow.g1{width:420px; height:420px; background:var(--cyan); top:-120px; left:-100px;}
  .bg-glow.g2{width:380px; height:380px; background:var(--gold); bottom:-140px; right:-100px; animation-delay:-4s;}
  .bg-glow.g3{width:300px; height:300px; background:var(--violet); top:40%; right:10%; animation-delay:-8s;}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(30px,-30px) scale(1.08);}
  }

  .stars{position:absolute; inset:0; z-index:0;}
  .star{position:absolute; width:3px; height:3px; background:var(--text); border-radius:50%; opacity:0.5; animation:twinkle 3s infinite;}
  @keyframes twinkle{0%,100%{opacity:0.15;} 50%{opacity:0.8;}}

  .orbit-deco{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:920px; height:920px; z-index:0; opacity:0.5; pointer-events:none;
  }
  .orbit-deco svg{width:100%; height:100%; animation:spin 60s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .card{
    position:relative; z-index:2; width:100%; max-width:400px;
    background:rgba(19,31,53,0.75); border:1px solid var(--line); border-radius:24px;
    padding:40px 34px; backdrop-filter:blur(18px);
    box-shadow:0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(51,214,192,0.08);
  }
  .brand{display:flex; align-items:center; gap:12px; justify-content:center; margin-bottom:6px;}
  .brand svg{width:40px; height:40px;}
  .brand span{font-size:26px; font-weight:700;}
  .tagline{text-align:center; color:var(--text-dim); font-size:13.5px; margin-bottom:32px;}

  .field{margin-bottom:18px;}
  .field label{font-size:12.5px; color:var(--text-dim); display:flex; gap:4px; margin-bottom:7px;}
  .field label .req{color:var(--coral);}
  .input-row{
    display:flex; align-items:center; gap:10px; background:var(--bg-soft); border:1px solid var(--line);
    border-radius:12px; padding:0 14px; transition:.15s;
  }
  .input-row:focus-within{border-color:var(--cyan); box-shadow:0 0 0 3px rgba(51,214,192,0.12);}
  .flag{font-size:18px;}
  .input-row input{
    flex:1; background:transparent; border:none; outline:none; color:var(--text);
    font-family:inherit; font-size:15px; padding:13px 0;
  }
  .input-row input::placeholder{color:var(--text-dim);}
  .eye{cursor:pointer; color:var(--text-dim); font-size:15px; user-select:none;}

  .submit-btn{
    width:100%; margin-top:8px; padding:15px; border:none; border-radius:12px;
    background:linear-gradient(135deg, var(--cyan), #1fa896); color:#06251f; font-weight:700; font-size:15px;
    letter-spacing:0.03em; cursor:pointer; position:relative; overflow:hidden;
    box-shadow:0 10px 30px rgba(51,214,192,0.25);
  }
  .submit-btn:hover{filter:brightness(1.06);}
  .submit-btn:active{transform:scale(0.98);}

  .divider{display:flex; align-items:center; gap:12px; margin:26px 0 20px; color:var(--text-dim); font-size:12px;}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line);}

  .footer-note{text-align:center; font-size:13px; color:var(--text-dim);}
  .footer-note a{color:var(--cyan); font-weight:600;}

  .streak-chip{
    position:absolute; top:-16px; right:22px; background:var(--gold); color:#241a04;
    font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px; z-index:3;
    box-shadow:0 6px 16px rgba(242,184,75,0.35);
    display:flex; align-items:center; gap:5px;
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="bg-glow g1"></div>
<div class="bg-glow g2"></div>
<div class="bg-glow g3"></div>

<div class="orbit-deco">
  <svg viewBox="0 0 920 920" fill="none">
    <circle cx="460" cy="460" r="300" stroke="#24365A" stroke-width="1"/>
    <circle cx="460" cy="460" r="220" stroke="#33D6C0" stroke-width="1" stroke-dasharray="3 8" opacity="0.5"/>
    <ellipse cx="460" cy="460" rx="380" ry="140" stroke="#F2B84B" stroke-width="1" opacity="0.35"/>
    <circle cx="760" cy="460" r="7" fill="#33D6C0"/>
    <circle cx="140" cy="400" r="5" fill="#F2B84B"/>
    <circle cx="460" cy="120" r="4" fill="#8B93F5"/>
  </svg>
</div>

<div class="card">
  <div class="streak-chip">🔥 32,922 talaba bilan birga</div>
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14" stroke="#33D6C0" stroke-width="2"/><ellipse cx="16" cy="16" rx="14" ry="5.5" stroke="#F2B84B" stroke-width="1.4"/><line x1="16" y1="2" x2="16" y2="30" stroke="#24365A" stroke-width="1.2"/></svg>
    <span>World</span>
  </div>
  <div class="tagline">Butun dunyo tilida IT'ni o'rganing</div>

  <form method="post" action="#">

    <div class="field">
      <label>Telefon raqam <span class="req">*</span></label>
      <div class="input-row">
        <span class="flag">🇺🇿</span>
        <input type="tel" name="phone" placeholder="+998 __ ___ __ __" required>
      </div>
    </div>

    <div class="field">
      <label>Parol <span class="req">*</span></label>
      <div class="input-row">
        <input type="password" name="password" id="pwd" placeholder="••••••••" required>
        <span class="eye" onclick="togglePwd()">👁</span>
      </div>
    </div>

    <button type="submit" class="submit-btn">KIRISH →</button>
  </form>

  <div class="divider">yoki</div>
  <div class="footer-note">Hali ro'yxatdan o'tmagansizmi? <a href="#">Ro'yxatdan o'tish</a></div>
</div>

<script>
  // Fonga tasodifiy yulduzchalar
  const starsEl = document.getElementById('stars');
  for(let i=0;i<40;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.animationDelay = (Math.random()*3) + 's';
    starsEl.appendChild(s);
  }

  function togglePwd(){
    const el = document.getElementById('pwd');
    el.type = el.type === 'password' ? 'text' : 'password';
  }
</script>

</body>
</html>
